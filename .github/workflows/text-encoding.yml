name: Text encoding check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-text-encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check tracked source text for mojibake
        run: python scripts/check_text_encoding.py


  ban-appeal-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-asyncio "discord.py>=2.7.0" python-dotenv
      - name: Run ban appeal and moderation hierarchy regression tests
        run: python -m pytest -q tests/test_ban_appeal_lifecycle.py tests/test_moderation_hierarchy.py
